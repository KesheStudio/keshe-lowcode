<!DOCTYPE html>
<html lang="zh-CN" data-lc-theme="ink-green" data-lc-mode="light" data-lc-storage-key="lc-switcher-demo">
<head>
  <meta charset="utf-8" />
  <script>
/* 防白闪：必须在 <head> 里、样式表之前同步执行。由 src/theme/theme-boot.mjs 生成。 */
(function () {
  'use strict';
  var root = document.documentElement;
  var saved = null;
  try { saved = JSON.parse(window.localStorage.getItem("lc-switcher-demo") || 'null'); } catch (error) { saved = null; }
  var allowed = ["auth-clean","blueprint-amber","dashboard-calm","docs-quiet","ink-graphite","ink-green","ink-navy","ink-ochre","night-contrast","portfolio-bold"];
  var theme = saved && typeof saved.theme === 'string' ? saved.theme : null;
  if (allowed && theme && allowed.indexOf(theme) === -1) theme = null;
  if (!theme) theme = root.getAttribute('data-lc-theme') || "ink-green";
  var mode = saved && saved.mode;
  if (mode !== 'light' && mode !== 'dark') {
    mode = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  root.setAttribute('data-lc-theme', theme);
  root.setAttribute('data-lc-mode', mode);
  root.style.colorScheme = mode;
})();
</script>

    .demo-foot { color: var(--lc-color-muted); font-size: var(--lc-text-xs); }

<header class="demo-top">
  <div class="demo-brand">科设笔记<small>theme switcher demo</small></div>
  <div class="lc-theme-switch" data-lc-theme-switch data-storage-key="lc-switcher-demo" data-default-theme="ink-green">
    <span class="lc-theme-switch-label">外观</span>
    <button class="lc-tab is-active" type="button" data-lc-theme-mode="system" aria-pressed="true">跟随系统</button>
    <button class="lc-tab" type="button" data-lc-theme-mode="light" aria-pressed="false">亮</button>
    <button class="lc-tab" type="button" data-lc-theme-mode="dark" aria-pressed="false">暗</button>
    <select class="lc-select" data-lc-theme-select aria-label="主题">
          <option value="auth-clean">认证 · 净白</option>
          <option value="blueprint-amber">蓝图 · 琥珀</option>
          <option value="dashboard-calm">仪表盘 · 石青</option>
          <option value="docs-quiet">文档 · 素白</option>
          <option value="ink-graphite">纸墨 · 石墨</option>
          <option value="ink-green" selected>纸墨 · 松绿</option>
          <option value="ink-navy">纸墨 · 藏青</option>
          <option value="ink-ochre">纸墨 · 赭石</option>
          <option value="night-contrast">夜航 · 高对比</option>
          <option value="portfolio-bold">作品集 · 赤霞</option>
    </select>
  </div>
</header>
<main class="demo-doc">
  <h1>把主题切换交给读者</h1>
  <p class="demo-lead">这一页不写死任何颜色：按钮、表格、图表全部引用 CSS 变量。右上角切换器只改 html 上的 data-lc-theme 与 data-lc-mode。</p>

  <div class="demo-actions">
    <button class="lc-btn lc-btn-primary" type="button"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-save"></use></svg><span class="lc-btn-label">保存</span></button>
    <button class="lc-btn" type="button"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-eye"></use></svg><span class="lc-btn-label">预览</span></button>
    <button class="lc-btn lc-btn-ghost" type="button"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-more"></use></svg><span class="lc-btn-label">更多</span></button>
    <span class="lc-badge lc-badge-success">已同步</span>
  </div>

  <div class="demo-card">
    <p>正文、次要文字、占位符和禁用态都在这一屏里。切换主题后，注意看输入框描边和按钮悬停色。</p>
    <div class="lc-field" style="max-width:320px">
      <label class="lc-label" for="demoName">订阅邮箱</label>
      <input class="lc-input" id="demoName" placeholder="you@example.com" />
    </div>
    <div class="lc-check" style="margin-top:12px"><input id="demoCheck" type="checkbox" checked /> <span><label for="demoCheck">接收每周摘要</label></span></div>
  </div>

  <h2>表格与图表</h2>
  <div class="demo-card">
    <table class="demo-table">
      <thead><tr><th>页面</th><th>状态</th><th>更新时间</th></tr></thead>
      <tbody>
        <tr><td>主题与令牌</td><td>已发布</td><td>今天</td></tr>
        <tr><td>组件库</td><td>草稿</td><td>昨天</td></tr>
        <tr><td>导出设置</td><td>待审</td><td>3 天前</td></tr>
      </tbody>
    </table>
    <div class="demo-bars" role="img" aria-label="示例柱状图">
      <span style="height:52%"></span><span style="height:74%"></span><span style="height:100%"></span><span style="height:40%"></span><span style="height:63%"></span>
    </div>
  </div>

  <p class="demo-foot">切换结果会存在 localStorage（key: lc-switcher-demo）。刷新后保持；选「跟随系统」时监听系统深浅变化。</p>
</main>
<script src="theme-switch.js"></script>
</body>
</html>
