<div class="te-app">
  <header class="te-bar">
        <div class="te-brand">
          <span class="te-brand-mark lc-icon" aria-hidden="true"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-palette"></use></svg></span>
          <span>主题编辑器</span>
          <span class="lc-badge lc-badge-success" id="teSiteBadge" hidden></span>
        </div>
        <span class="te-save-state" id="teSaveState">内置主题 · 改动会另存为草稿</span>
        <div class="te-bar-actions">
          <button class="lc-btn lc-btn-sm" type="button" id="teNew"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-add"></use></svg><span class="lc-btn-label">新建</span></button>
          <button class="lc-btn lc-btn-sm" type="button" id="teDuplicate"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-copy"></use></svg><span class="lc-btn-label">复制</span></button>
          <button class="lc-btn lc-btn-primary lc-btn-sm" type="button" data-save><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-save"></use></svg><span class="lc-btn-label" data-save-label>保存草稿</span></button>
          <button class="lc-btn lc-btn-sm" type="button" id="teExport"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-download"></use></svg><span class="lc-btn-label">导出 JSON</span></button>
          <button class="lc-btn lc-btn-sm" type="button" id="teImportLabel"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-upload"></use></svg><span class="lc-btn-label">导入</span></button>
          <input type="file" id="teImportFile" accept=".json,application/json" hidden />
          <label class="te-chrome" for="teSiteMode" id="teSiteModeLabel" hidden>
            <span>站点默认外观</span>
            <select class="lc-select" id="teSiteMode">
              <option value="auto">跟随系统</option>
              <option value="light">亮色</option>
              <option value="dark">暗色</option>
            </select>
          </label>
          <label class="te-chrome" for="teChromeMode">
            <span>编辑器外观</span>
            <select class="lc-select" id="teChromeMode">
              <option value="auto" selected>跟随主题</option>
              <option value="light">强制亮色</option>
              <option value="dark">强制暗色</option>
            </select>
          </label>
          <a class="lc-btn lc-btn-ghost lc-btn-sm" href="../builder.html" id="teBackBuilder"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-edit"></use></svg><span class="lc-btn-label">返回编辑器</span></a>
          <a class="lc-btn lc-btn-ghost lc-btn-sm" href="../home.html" id="teBackHome"><svg class="lc-icon" aria-hidden="true"><use href="#lc-icon-external"></use></svg><span class="lc-btn-label">返回工作台</span></a>
        </div>
      </header>
  <main class="te-main">
    <aside class="te-themes" aria-label="主题列表">
        <h2>主题</h2>
        <p class="te-themes-hint" id="teThemesHint">内置主题只读，改动会另存为草稿；自定义主题存在浏览器本地。</p>
        <div id="teThemeList"></div>
        <div class="te-drop" id="teDrop">
          把导出的主题 JSON 拖到这里
          <br />
          或点顶栏「导入」。不合格也会载入，并逐条列出问题。
        </div>
      </aside>
    <section class="te-form" aria-label="色板编辑">
        <div class="te-form-head">
          <h2>色板</h2>
          <span class="te-form-meta" id="teFormMeta">亮色 · 内置主题副本</span>
        </div>

        <div class="lc-tabs" role="tablist" aria-label="编辑亮色或暗色" id="teModeTabs">
          <button class="lc-tab is-active" type="button" role="tab" aria-selected="true" data-mode="light" tabindex="0">亮色</button>
          <button class="lc-tab" type="button" role="tab" aria-selected="false" data-mode="dark" tabindex="-1">暗色</button>
        </div>

        <fieldset class="te-group">
          <legend>主题信息</legend>
          <div class="te-group-body">
            <div class="te-meta-grid">
              <div class="lc-field">
                <label class="lc-label" for="teId">id <small>小写字母/数字/连字符</small></label>
                <input class="lc-input" id="teId" spellcheck="false" autocomplete="off" />
              </div>
              <div class="lc-field">
                <label class="lc-label" for="teName">名称</label>
                <input class="lc-input" id="teName" autocomplete="off" />
              </div>
              <div class="lc-field">
                <label class="lc-label" for="teTone">调性</label>
                <select class="lc-select" id="teTone">
          <option value="paper" selected>纸感</option>
          <option value="cool">冷调</option>
          <option value="warm">暖调</option>
          <option value="neutral">中性</option>
          <option value="high-contrast">高对比</option>
          <option value="blueprint">工程蓝</option>
                </select>
              </div>
              <div class="lc-field te-span-2">
                <label class="lc-label" for="teDescription">描述</label>
                <input class="lc-input" id="teDescription" autocomplete="off" />
              </div>
            </div>
          </div>
        </fieldset>

        <fieldset class="te-group">
          <legend>主色（种子）</legend>
          <div class="te-group-body" id="teSeeds"></div>
        </fieldset>

        <details class="te-group" open>
          <summary>派生色（自动计算，可逐项覆盖）<span class="te-form-meta" id="teDerivedCount" style="margin-left:8px"></span></summary>
          <div class="te-group-body">
            <div class="te-derived-list" id="teDerived"></div>
          </div>
        </details>

        <fieldset class="te-group">
          <legend>实时校验</legend>
          <div class="te-group-body">
            <div id="teChecks"></div>
            <div class="te-import-report" id="teImportReport" hidden></div>
          </div>
        </fieldset>
      </section>
    <section class="te-preview" aria-label="实时预览">
        <div class="te-preview-head">
          <h2>实时预览</h2>
          <span class="te-preview-meta" id="tePreviewMeta"></span>
        </div>
        <div class="te-panes">
          <div class="te-pane">
            <div class="te-pane-head"><span>亮色 light</span><span>同步编辑</span></div>
            <div class="te-pane-body" id="tePaneLight"></div>
          </div>
          <div class="te-pane">
            <div class="te-pane-head"><span>暗色 dark</span><span>同步编辑</span></div>
            <div class="te-pane-body" id="tePaneDark"></div>
          </div>
        </div>
      </section>
  </main>
</div>
