# =============================================================================
# 低代码平台推荐 nginx 配置（NGINX_CONFIG_VERSION = 1）
#
# 这份文件是“派生 + 可覆盖”：平台重新生成会提示覆盖 / 保留，用户改过的内容不会静默丢失。
#
# 运行方式（从站点根目录，也就是包含 web/、server/、deploy/、certs/ 的目录）：
#   mkdir -p logs temp
#   nginx -p "$(pwd)" -c "$(pwd)/deploy/nginx/nginx.conf"
#   nginx -p "$(pwd)" -c "$(pwd)/deploy/nginx/nginx.conf" -s reload
# 要求 nginx >= 1.25.3：证书路径按“配置文件所在目录”解析；更老版本见 ssl_certificate 处说明。
#
# web/、logs/、temp/ 相对 -p 指定的站点根，因此整个目录可以整体搬走。
# 证书按本配置文件所在目录解析，见 ssl_certificate 注释；证书不进导出包，部署时生成或导入。
#
# 每项配置上方注释都写了“默认值 + 为什么”，改之前先读一遍再动。
# =============================================================================

# 工作进程数：auto = 跟随 CPU 核数。小机器可改成固定值（如 2）以限制内存。
worker_processes  auto;

# pid 与错误日志都放在站点根的 logs/ 下，避免写到系统目录；权限不足时先 mkdir -p logs。
pid        logs/nginx.pid;
# warn = 只记录告警与错误；排查问题时可临时改成 info 或 debug（debug 日志量很大）。
error_log  logs/error.log warn;

# 单进程最大并发连接数：默认 1024。每个浏览器通常占用 2–6 个连接，按访问量调整。
events {
    worker_connections  1024;
}

http {
    # 用内联 types，避免依赖系统 nginx 的 mime.types 路径（Windows / 容器里更稳）。
    # 新增文件类型时在这里加一行，不要直接写 application/octet-stream。
    types {
        text/html                             html htm;
        text/css                              css;
        application/javascript                js mjs;
        application/json                      json map;
        image/svg+xml                         svg;
        image/png                             png;
        image/jpeg                            jpg jpeg;
        image/webp                            webp;
        image/gif                             gif;
        image/x-icon                          ico;
        font/woff2                            woff2;
        font/woff                             woff;
        font/ttf                              ttf;
        text/plain                            txt;
        application/pdf                       pdf;
        application/xml                       xml;
        video/mp4                             mp4;
        application/octet-stream              bin;
    }
    default_type  application/octet-stream;

    # 零拷贝与 TCP 优化：静态站默认开启；反向代理场景保持 on 即可。
    sendfile        on;
    tcp_nopush      on;

    # 长连接空闲时间：默认 65s。上游/浏览器都复用时减少握手开销。
    keepalive_timeout  65;

    # 不在响应头/错误页暴露 nginx 版本号（降低被针对已知漏洞扫描的概率）。
    server_tokens   off;

    # 访问日志字段说明：
    #   $request_time          nginx 收到请求到响应完成的总耗时（秒）
    #   $upstream_response_time 后端处理耗时；排查“慢在 nginx 还是慢在后端”
    #   $request_id             nginx 生成的请求 ID，可和上游日志对照
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
                      'req=$request_id';

    # 访问日志路径相对站点根；静态资源命中时可考虑在对应 location 里 access_log off。
    access_log  logs/access.log  main;

    # ---------------------------------------------------------------- gzip
    # 默认开启：省带宽。小于 1024 字节的文件压缩收益低、还多耗 CPU，所以设下限。
    gzip              on;
    gzip_vary         on;          # 让缓存/CDN 区分“压缩版”和“未压缩版”
    gzip_comp_level   5;           # 1–9；5 是压缩率与 CPU 的折中
    gzip_min_length   1024;        # 与后端模板的 1 KB 阈值保持一致
    gzip_proxied      any;         # 经过代理的请求也压缩
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml image/svg+xml;

    # WebSocket 升级用（默认关闭；需要时把下面两行 proxy_set_header 取消注释）。
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------------------------------------------------------------- HTTP → HTTPS
    # 默认 80 → 443 永久跳转。只保留一个入口，避免 HTTP 与 HTTPS 两套缓存/安全策略。
    # 本地/内网也可改成 8080/8443 这类高位端口，改端口时同步改下面的跳转目标。
    server {
        listen       80;
        # 默认写三个名字，部署时改成自己的域名；保留 localhost/127.0.0.1 便于本机测试。
        server_name  example.com localhost 127.0.0.1;

        # 301 永久跳转：浏览器会缓存，确定要长期用 HTTPS 再启用；临时调试可改 302。
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------- HTTPS 主站
    server {
        listen       443 ssl;
        # nginx >= 1.25.1 用 http2 on；更老的版本改成 listen 443 ssl http2; 并删掉这一行。
        http2        on;

        server_name  example.com localhost 127.0.0.1;

        # 证书路径相对“本配置文件所在目录”（nginx ≥ 1.25.3 的相对路径规则）。
        # 本文件位于 <站点根>/deploy/nginx/，所以 ../../certs 指回 <站点根>/certs。
        # 若用更老的 nginx（相对 prefix 解析），把下面两行改成 certs/site.crt、certs/site.key。
        # 私钥权限必须是 600（Windows 用 icacls 收紧），且绝不提交仓库。
        ssl_certificate      ../../certs/site.crt;
        ssl_certificate_key  ../../certs/site.key;

        # 只启用 TLS 1.2/1.3：兼容主流客户端，同时淘汰 TLS 1.0/1.1。
        ssl_protocols        TLSv1.2 TLSv1.3;

        # 仅保留前向保密（ECDHE）与 AEAD 套件；默认值已足够，按合规要求再收紧。
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        # off：由客户端选择套件，现代客户端通常比服务器端列表更合适。
        ssl_prefer_server_ciphers  off;

        # 会话缓存 10 MB 约可放数万会话；1d 超时减少重复握手。
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        # 关闭会话票据，减少密钥泄露后的历史流量解密风险（代价是握手略多）。
        ssl_session_tickets  off;

        # HSTS 默认注释：自签测试证书阶段开启会让浏览器长期强制 HTTPS，很难回退。
        # 正式证书 + 确认全站 HTTPS 后再取消注释。
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 基础安全头：默认三项，低风险且几乎不影响业务。
        add_header X-Content-Type-Options  nosniff                         always;
        add_header X-Frame-Options         SAMEORIGIN                     always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;

        # 上传大小：nginx 默认 1m 偏小；10m 覆盖常规图片/文档上传。
        # 注意后端 JSON 接口另有 1 MB 上限，调大这里不会放宽 API 的请求体限制。
        client_max_body_size  10m;

        # 静态站根目录：导出产物里的 web/；放在 server 块外也可，这里保持与产物结构一致。
        root   web;
        index  index.html;
        {{BASE_PATH_REWRITE}}

        # ------------------------------------------------------------ API 反向代理
        # upstream 默认 127.0.0.1:8080，与后端模板默认端口一致。
        # 只代理 /api/，静态与前端路由仍由 nginx 直接处理。
        location /api/ {
            proxy_pass  http://127.0.0.1:8080;

            # 只支持 HTTP/1.1 才能正确复用长连接和 WebSocket。
            proxy_http_version  1.1;

            # 传递真实来源信息；后端日志与限流依赖这些头（生产环境不要伪造）。
            proxy_set_header  Host               $host;
            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host   $host;

            # 超时：连接 5s 足够本机/内网；读写 60s 覆盖常规 API。
            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # 需要 WebSocket 时取消下面两行注释（默认 proxy.websocket=false）。
            # proxy_set_header Upgrade    $http_upgrade;
            # proxy_set_header Connection $connection_upgrade;
        }

        # ------------------------------------------------------------ 静态资源缓存
        # 带内容哈希的 css/js/字体/图片可以长缓存；immutable 表示“无需再校验”。
        location ~* \.(?:css|js|mjs|json|map|woff2?|ttf|png|jpe?g|webp|gif|svg|ico|mp4)$ {
            try_files  $uri =404;
            # 1 年 + immutable：文件名变则内容变，适合导出站的哈希资源。
            # 若你的文件名不带哈希，请把这里改成 max-age=3600 或去掉 immutable。
            add_header Cache-Control          "public, max-age=31536000, immutable" always;
            # nginx 的 add_header 不会从 server 继承，安全头必须在每个 location 重复。
            add_header X-Content-Type-Options  nosniff                         always;
            add_header X-Frame-Options         SAMEORIGIN                     always;
            add_header Referrer-Policy         strict-origin-when-cross-origin always;
        }

        # HTML 不长缓存：保证发布后用户能拿到新页面。
        location ~* \.html?$ {
            try_files  $uri =404;
            add_header Cache-Control          "no-cache"                      always;
            add_header X-Content-Type-Options  nosniff                         always;
            add_header X-Frame-Options         SAMEORIGIN                     always;
            add_header Referrer-Policy         strict-origin-when-cross-origin always;
        }

        # 静态站回退：默认按文件存在性返回 404。
        # 如果站点是前端路由（history 模式），改成 try_files $uri $uri/ /index.html;
        # 但这样会把缺失的资源和拼错的路径都返回首页，排障更难，默认不做。
        location / {
            try_files  $uri $uri/ =404;
        }

        # 拒绝以点开头的隐藏文件（.git、.env、编辑器临时文件）；保留 ACME 校验目录。
        location ~ /\.(?!well-known) {
            deny  all;
        }
    }
}
