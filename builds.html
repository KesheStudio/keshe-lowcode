<!DOCTYPE html>
<html lang="zh-CN" data-lc-mode="light" data-lc-mode-pref="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>构建记录 · 低代码工作台</title>
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="lc-token" content="__LC_TOKEN__">
<link rel="icon" href="vendor/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/lc-tokens.css">
<link rel="stylesheet" href="assets/css/lc-controls.css">
<link rel="stylesheet" href="assets/css/lc-editor.css">
<link rel="stylesheet" href="assets/css/lc-responsive.css">
<style>
  .lc-builds-main { display: flex; flex-direction: column; overflow: auto; padding: var(--lc-space-5); gap: var(--lc-space-4); }
  .lc-builds-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--lc-space-4); }
  .lc-builds-head h1 { margin: 0 0 var(--lc-space-1); font-family: var(--lc-font-serif); font-size: var(--lc-text-xl); }
  .lc-builds-head p { margin: 0; color: var(--lc-color-muted); font-size: var(--lc-text-sm); }
  .lc-builds-head-actions { display: flex; align-items: center; gap: var(--lc-space-2); flex-wrap: wrap; }
  .lc-builds-site-field { flex-direction: row; align-items: center; gap: var(--lc-space-2); }
  .lc-builds-site-field .lc-label { margin: 0; }
  .lc-builds-gate { display: flex; flex-direction: column; gap: var(--lc-space-3); padding: var(--lc-space-5); border: 1px dashed var(--lc-color-line-strong); border-radius: var(--lc-radius-md); background: var(--lc-color-surface); }
  .lc-builds-gate h2 { margin: 0; font-size: var(--lc-text-lg); }
  .lc-builds-gate p { margin: 0; color: var(--lc-color-muted); font-size: var(--lc-text-sm); }
  .lc-builds-project-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--lc-space-3); }
  .lc-builds-project { display: flex; flex-direction: column; gap: var(--lc-space-1); padding: var(--lc-space-3); border: var(--lc-border); border-radius: var(--lc-radius-sm); background: var(--lc-color-surface-2); color: inherit; text-decoration: none; }
  .lc-builds-project:hover { border-color: var(--lc-color-accent); background: var(--lc-color-accent-soft); }
  .lc-builds-project strong { font-size: var(--lc-text-sm); }
  .lc-builds-project small { color: var(--lc-color-muted); font-size: var(--lc-text-xs); }
  .lc-builds-empty { padding: var(--lc-space-6); border: 1px dashed var(--lc-color-line-strong); border-radius: var(--lc-radius-md); background: var(--lc-color-surface); color: var(--lc-color-muted); text-align: center; }
  .lc-builds-empty a { color: var(--lc-color-accent); }
  .lc-builds-table td:first-child { min-width: 190px; }
  .lc-builds-table .lc-builds-id { display: block; font-family: var(--lc-font-mono); font-size: var(--lc-text-xs); word-break: break-all; }
  .lc-builds-table .lc-builds-version { color: var(--lc-color-muted); font-size: var(--lc-text-xs); }
  .lc-builds-actions { display: flex; align-items: center; gap: var(--lc-space-1); white-space: nowrap; }
  .lc-builds-dialog { position: fixed; inset: 0; z-index: var(--lc-z-modal); display: flex; align-items: center; justify-content: center; padding: var(--lc-space-4); background: rgba(12,16,14,.5); }
  .lc-builds-dialog[hidden] { display: none; }
  .lc-builds-dialog-card { display: flex; flex-direction: column; width: min(820px, 96vw); max-height: min(780px, 92vh); border: var(--lc-border); border-radius: var(--lc-radius-md); background: var(--lc-color-surface); box-shadow: 0 18px 48px rgba(0,0,0,.28); overflow: hidden; }
  .lc-builds-dialog-head { display: flex; align-items: center; gap: var(--lc-space-2); padding: var(--lc-space-3) var(--lc-space-4); border-bottom: var(--lc-border); }
  .lc-builds-dialog-head h2 { margin: 0; font-size: var(--lc-text-sm); }
  .lc-builds-dialog-head .is-right { margin-left: auto; display: flex; align-items: center; gap: var(--lc-space-2); }
  .lc-builds-dialog-body { overflow: auto; padding: var(--lc-space-4); display: grid; gap: var(--lc-space-4); }
  .lc-builds-metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--lc-space-3); }
  .lc-builds-metric { display: flex; flex-direction: column; gap: 2px; padding: var(--lc-space-2) var(--lc-space-3); border: var(--lc-border); border-radius: var(--lc-radius-sm); background: var(--lc-color-surface-2); min-width: 0; }
  .lc-builds-metric span { color: var(--lc-color-muted); font-size: var(--lc-text-xs); }
  .lc-builds-metric b { font-size: var(--lc-text-sm); font-weight: 500; word-break: break-all; }
  .lc-builds-issues { display: flex; flex-direction: column; gap: var(--lc-space-2); }
  .lc-builds-issue { padding: var(--lc-space-2) var(--lc-space-3); border: 1px solid var(--lc-color-line); border-radius: var(--lc-radius-sm); font-size: var(--lc-text-xs); }
  .lc-builds-issue b { display: block; font-weight: 500; }
  .lc-builds-issue em { font-style: normal; color: var(--lc-color-muted); }
  .lc-builds-issue.is-fail { border-color: var(--lc-color-danger-line); background: var(--lc-color-danger-soft); }
  .lc-builds-issue.is-warn { border-color: var(--lc-color-warn-line); background: var(--lc-color-warn-soft); }
  .lc-builds-checks { display: flex; flex-direction: column; gap: 1px; border: var(--lc-border); border-radius: var(--lc-radius-sm); overflow: hidden; }
  .lc-builds-check { display: flex; align-items: baseline; gap: var(--lc-space-2); padding: 5px var(--lc-space-3); background: var(--lc-color-surface-2); font-size: var(--lc-text-xs); }
  .lc-builds-check + .lc-builds-check { border-top: 1px solid var(--lc-color-line); }
  .lc-builds-check b { flex: 0 0 62px; font-weight: 500; }
  .lc-builds-check.is-pass b { color: var(--lc-color-success); }
  .lc-builds-check.is-fail b { color: var(--lc-color-danger); }
  .lc-builds-check.is-skip b { color: var(--lc-color-muted); }
  .lc-builds-check span { color: var(--lc-color-muted); min-width: 0; }
  .lc-builds-section-title { margin: 0 0 var(--lc-space-2); font-size: var(--lc-text-sm); font-weight: 600; }
  @media (max-width: 900px) {
    .lc-builds-main { padding: var(--lc-space-4) var(--lc-space-3); }
    .lc-builds-head { flex-direction: column; }
    .lc-builds-head-actions { width: 100%; }
  }
  @media (max-width: 640px) {
    .lc-builds-main { padding: var(--lc-space-3) var(--lc-space-2); }
    .lc-builds-gate { padding: var(--lc-space-4) var(--lc-space-3); }
    .lc-builds-project-list { grid-template-columns: minmax(0, 1fr); }
    .lc-builds-dialog-card { width: 100%; max-height: 94vh; }
  }
</style>
</head>
<body class="lc-shell">

<header class="lc-topbar">
  <a class="lc-brand lc-brand-link" href="home.html" title="返回工作台">
    <span class="lc-brand-mark" aria-hidden="true"></span>
    <span class="lc-brand-text">构建记录</span>
    <span class="lc-brand-sub">历史 · 详情 · 产物</span>
  </a>

  <div class="lc-topbar-side">
    <a class="lc-btn lc-btn-sm" href="home.html">返回工作台</a>
    <label class="lc-field lc-builds-site-field">
      <span class="lc-label">项目</span>
      <select class="lc-select" data-site-select aria-label="选择要查看构建记录的项目"></select>
    </label>
    <a class="lc-btn lc-btn-sm" data-back-builder href="builder.html">返回 Builder</a>
  </div>
</header>

<main class="lc-main lc-builds-main">
  <section class="lc-builds-head">
    <div>
      <h1>构建记录</h1>
      <p data-site-meta>正在读取站点…</p>
    </div>
    <div class="lc-builds-head-actions">
      <a class="lc-btn lc-btn-sm lc-btn-primary" data-export href="export.html">去导出</a>
      <button class="lc-btn lc-btn-sm" type="button" data-refresh>刷新</button>
    </div>
  </section>

  <section class="lc-builds-gate" data-gate hidden>
    <h2 data-gate-title>选择要查看的项目</h2>
    <p data-gate-text></p>
    <div class="lc-builds-project-list" data-gate-list></div>
  </section>

  <section data-body hidden>
    <div class="lc-builds-empty" data-empty hidden>
      这个项目还没有构建记录。先到<a data-export-empty href="export.html">导出向导</a>导出一次，构建历史和产物会出现在这里。
    </div>
    <div class="lc-table-wrap">
      <table class="lc-table lc-builds-table">
        <thead>
          <tr>
            <th>构建</th>
            <th>时间</th>
            <th class="is-num">页面数</th>
            <th class="is-num">体积</th>
            <th>结果</th>
            <th class="is-num">警告</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody data-build-list></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="lc-statusbar">
  <span class="lc-statusbar-item" data-status-text>就绪</span>
  <span class="lc-statusbar-item" data-status-rev></span>
</footer>

<div class="lc-builds-dialog" data-dialog hidden>
  <div class="lc-builds-dialog-card" role="dialog" aria-modal="true" aria-labelledby="lc-builds-dialog-title">
    <header class="lc-builds-dialog-head">
      <h2 id="lc-builds-dialog-title" data-dialog-title>构建详情</h2>
      <div class="is-right">
        <a class="lc-btn lc-btn-sm lc-btn-primary" data-dialog-download href="#" hidden>下载产物</a>
        <button class="lc-btn lc-btn-sm" type="button" data-dialog-close>关闭</button>
      </div>
    </header>
    <div class="lc-builds-dialog-body" data-dialog-body></div>
  </div>
</div>

<script src="assets/builds.js"></script>
</body>
</html>
